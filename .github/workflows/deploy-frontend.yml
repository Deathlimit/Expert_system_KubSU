name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [frontend_web]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Сборка и загрузка артефакта — ОТДЕЛЬНЫМ job'ом от деплоя.
  #
  # Почему два job'а, а не один: upload-pages-artifact и deploy-pages в одном
  # job'е ловят гонку. Артефакт финализируется за доли секунды до того, как
  # deploy-pages запросит список артефактов, API успевает вернуть пустой
  # список, и шаг падает с "No artifacts named github-pages"
  # (а повторный запуск того же run'а добавляет второй артефакт и ломается
  # уже на "Multiple artifacts ... Artifact count is 2").
  # См. actions/deploy-pages#451.
  # Отдельный job стартует через несколько секунд после загрузки — артефакт
  # к этому моменту уже точно виден, и lookup не гоняется.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # configure-pages ДО сборки: он отдаёт base_path. Для project pages
      # это /<repo>/ — без него ассеты собираются с base "/" и на
      # https://<user>.github.io/<repo>/ дают 404.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}
          # Адрес API. По умолчанию — Cloudflare Worker-прокси: onrender.com
          # блокируется в РФ, поэтому браузер ходит на workers.dev, а воркер
          # пересылает запрос на Render (см. cloudflare/README.md).
          # Берём из переменной репозитория VITE_API_BASE, а если её нет — этот дефолт.
          # Без хвостового "/": фронт сам добавляет "/auth", "/queue" и т.д.
          VITE_API_BASE: ${{ vars.VITE_API_BASE || 'https://expert-api-proxy.danilreshetka.workers.dev' }}
        run: npm run build

      # v5 идёт в паре с deploy-pages@v5 (артефакт "github-pages").
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Отдельный job: lookup артефакта идёт уже по стабильному списку.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
