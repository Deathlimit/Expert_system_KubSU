name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [frontend_web]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # configure-pages ДО сборки: он отдаёт base_path. Для project pages
      # это /<repo>/ — без него ассеты собираются с base "/" и на
      # https://<user>.github.io/<repo>/ дают 404.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}
          # Адрес бэкенда на Render. Задайте в Settings -> Secrets and
          # variables -> Actions -> Variables (имя VITE_API_BASE),
          # иначе фронт будет стучаться в свой же origin и получит 404.
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: npm run build

      # Артефакт ОБЯЗАН называться github-pages — его создаёт этот шаг.
      # Если он не выполнится, deploy-pages упадёт с ошибкой
      # "No artifacts named github-pages were found".
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
